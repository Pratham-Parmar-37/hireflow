name: hireflow

services:
  # ----------------------------------------------------------------------------
  # Shared MongoDB Instance (Hosts 6 isolated databases per service)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: hireflow-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - hireflow-network
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Central Service Registry (Eureka Server)
  # ----------------------------------------------------------------------------
  eureka-server:
    image: hireflow:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hireflow-eureka-server
    environment:
      - SERVICE_NAME=eureka-server
    ports:
      - "8761:8761"
    networks:
      - hireflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # API Gateway (Central Routing & Entry Point)
  # ----------------------------------------------------------------------------
  api-gateway:
    image: hireflow:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hireflow-api-gateway
    environment:
      - SERVICE_NAME=api-gateway
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    ports:
      - "8088:8080"
    networks:
      - hireflow-network
    restart: unless-stopped



  # ----------------------------------------------------------------------------
  # 1. User Service
  # ----------------------------------------------------------------------------
  user-service:
    image: hireflow:latest

    build:
      context: .
      dockerfile: Dockerfile
    container_name: hireflow-user-service
    environment:
      - SERVICE_NAME=user-service
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/user_db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_started
    ports:
      - "8081:8081"
    networks:
      - hireflow-network
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 2. Company & Job Service
  # ----------------------------------------------------------------------------
  company-job-service:
    image: hireflow:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hireflow-company-job-service
    environment:
      - SERVICE_NAME=company-job-service
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/company_job_db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_started
    ports:
      - "8082:8082"
    networks:
      - hireflow-network
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 3. Candidate Service
  # ----------------------------------------------------------------------------
  candidate-service:
    image: hireflow:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hireflow-candidate-service
    environment:
      - SERVICE_NAME=candidate-service
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/candidate_db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_started
    ports:
      - "8083:8083"
    networks:
      - hireflow-network
    restart: unless-stopped


  # ----------------------------------------------------------------------------
  # 4. Application Service
  # ----------------------------------------------------------------------------
  application-service:
    image: hireflow:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hireflow-application-service
    environment:
      - SERVICE_NAME=application-service
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/application_db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_started
    ports:
      - "8084:8084"
    networks:
      - hireflow-network
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 5. Interview Service
  # ----------------------------------------------------------------------------
  interview-service:
    image: hireflow:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hireflow-interview-service
    environment:
      - SERVICE_NAME=interview-service
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/interview_db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_started
    ports:
      - "8085:8085"
    networks:
      - hireflow-network
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 6. Notification Service
  # ----------------------------------------------------------------------------
  notification-service:
    image: hireflow:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hireflow-notification-service
    environment:
      - SERVICE_NAME=notification-service
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/notification_db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_started
    ports:
      - "8086:8086"
    networks:
      - hireflow-network
    restart: unless-stopped

networks:
  hireflow-network:
    driver: bridge

volumes:
  mongo-data:
